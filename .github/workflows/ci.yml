name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find includes templates -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          for f in eventkoi.php bootstrap.php autoload.php uninstall.php; do
            [ -f "$f" ] && php -l "$f" > /dev/null
          done
          echo "No syntax errors on PHP ${{ matrix.php }}."

  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --prefix scripts/frontend
          npm install --prefix scripts/backend
      - name: Build
        run: npm run build

  lint:
    name: phpcs (advisory)
    runs-on: ubuntu-latest
    # Lite has never been linted. This job reports real findings but does not
    # block yet; make it blocking once the outstanding findings are cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Install phpcs and WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:"^3.9" \
            wp-coding-standards/wpcs:"^3.1" \
            dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"
      - name: Run phpcs
        run: phpcs -q --report=full
